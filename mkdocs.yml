site_name: SAFTViewer User Guide
site_url: https://teodorval.github.io/saftviewer-docs

theme:
  name: material
  language: bg
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.highlight

nav:
  - Въведение: index.md
  - Избор на фирма: firm-selection.md
  - Главен екран: main-window.md

  - Модули:
      - Осчетоводяване: accounting.md
      - Приходни документи: incoming-documents.md
      - Разходни документи: outgoing-documents.md
      - Плащания: payments.md
      - Активи: assets.md
      - Складови операции: warehouse.md
      - Справки: reports.md
      - Данни за фирмата: company-data.md
      - Сметкоплан: chart-of-accounts.md
      - Клиенти: clients.md
      - Доставчици: suppliers.md
      - Продукти: products.md
      - Импорт / Експорт: import-export.md

  - Екрани:
      - Редакция на сметка: account-edit.md
      - Редакция на клиент: client-edit.md
      - Редакция на доставчик: supplier-edit.md



  - Troubleshooting: troubleshooting.md
  - Release Notes: release-notes.md
